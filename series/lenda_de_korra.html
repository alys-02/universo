                    class="botao-voltar"

                <button
                    id="botao-proximo"

        function podeCarregarVideo(url) {

            const agora = Date.now();

            if (
                url === videoAtual &&
                agora - ultimoCarregamento < intervaloMinimo
            ) {

                alert(
                    "Aguarde alguns segundos antes de abrir este vídeo novamente."
                );

                return false;

            }

            ultimoCarregamento = agora;

            videoAtual = url;

            return true;

        }

        function mostrarTemporada(temporada) {

            temporadaAtual = temporada;

            episodioAtual = 1;

            document.getElementById(
                "temporadas"
            ).style.display = "none";

            document.getElementById(
                "episodios"
            ).style.display = "block";

            document.getElementById(
                "player"
            ).style.display = "none";

            document.getElementById(
                "titulo-temporada"
            ).textContent =
                "📺 Temporada " + temporada;

            const lista =
                document.getElementById(
                    "lista-episodios"
                );

            lista.innerHTML = "";

            episodios[temporada].forEach(
                function(id, indice) {

                    const episodio =
                        document.createElement("div");

                    episodio.className =
                        "episodio";

                    episodio.innerHTML = `

                        <div class="informacoes-episodio">

                            <span>
                                Episódio ${indice + 1}
                            </span>

                            <h3>
                                ${nomesEpisodios[temporada][indice]}
                            </h3>

                        </div>

                        <button>
                            ▶ Assistir
                        </button>

                    `;

                    episodio.onclick =
                        function() {

                            abrirEpisodio(
                                indice + 1
                            );

                        };

                    lista.appendChild(
                        episodio
                    );

                }
            );

        }

        function abrirEpisodio(numero) {

            episodioAtual = numero;

            const id =
                episodios[temporadaAtual]
                [numero - 1];

            const urlVideo =
                "https://drive.google.com/file/d/"
                + id
                + "/preview";

            if (
                !podeCarregarVideo(
                    urlVideo
                )
            ) {

                return;

            }

            document.getElementById(
                "episodios"
            ).style.display = "none";

            document.getElementById(
                "temporadas"
            ).style.display = "none";

            document.getElementById(
                "player"
            ).style.display = "block";

            document.getElementById(
                "titulo-player"
            ).textContent =

                "🎬 Temporada "
                + temporadaAtual
                + " - Episódio "
                + numero
                + " — "
                + nomesEpisodios[
                    temporadaAtual
                ][numero - 1];

            document.getElementById(
                "video"
            ).src = urlVideo;

            atualizarBotoes();

        }

        function episodioAnterior() {

            if (episodioAtual <= 1) {

                return;

            }

            abrirEpisodio(
                episodioAtual - 1
            );

        }

        function proximoEpisodio() {

            const total =
                episodios[
                    temporadaAtual
                ].length;

            if (episodioAtual >= total) {

                return;

            }

            abrirEpisodio(
                episodioAtual + 1
            );

        }

        function atualizarBotoes() {

            const botaoAnterior =
                document.getElementById(
                    "botao-anterior"
                );

            const botaoProximo =
                document.getElementById(
                    "botao-proximo"
                );

            const total =
                episodios[
                    temporadaAtual
                ].length;

            if (episodioAtual === 1) {

                botaoAnterior.disabled = true;

            } else {

                botaoAnterior.disabled = false;

            }

            if (
                episodioAtual === total
            ) {

                botaoProximo.disabled = true;

            } else {

                botaoProximo.disabled = false;

            }

        }

        function voltarTemporadas() {

            document.getElementById(
                "episodios"
            ).style.display = "none";

            document.getElementById(
                "player"
            ).style.display = "none";

            document.getElementById(
                "temporadas"
            ).style.display = "block";

            document.getElementById(
                "video"
            ).src = "";

            videoAtual = "";

        }

            document.getElementById(
                "episodios"
